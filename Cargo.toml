[workspace]
resolver = "2"
members = ["crates/wieland-core", "crates/wieland-cli", "crates/wieland-mcp"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.85"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
